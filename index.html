<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PK Direction Consultation</title>
<style>
:root { --bg:#fafaf5; --card:#fff; --ink:#171717; --muted:#5f6259; --line:#e4e2d6; --accent:#ffd202; --dark:#2b2b2b; }
@media (prefers-color-scheme: dark) { :root { --bg:#17180f; --card:#212217; --ink:#f2f1e8; --muted:#b0b0a0; --line:#3a3b2b; --dark:#f2f1e8; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
.wrap { max-width:640px; margin:0 auto; padding:16px; }
.nav { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 16px 8px 12px; font-weight:650; font-size:16px; }
.nav i { display:grid; place-items:center; width:28px; height:28px; border-radius:8px; background:var(--accent); color:#171717; font:800 15px system-ui; font-style:normal; }
.card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 24px; margin-top:28px; }
h1 { font:500 34px/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; letter-spacing:-.01em; margin:12px 0 14px; }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:999px; padding:4px 12px; color:var(--muted); }
.pill b { width:8px; height:8px; border-radius:50%; background:var(--accent); }
p { margin:0 0 14px; }
input { width:100%; font:inherit; padding:11px 14px; border-radius:16px; border:1px solid var(--line); background:var(--card); color:var(--ink); min-height:48px; }
button { font:inherit; font-weight:650; padding:12px 26px; border-radius:999px; border:1px solid var(--dark); background:var(--dark); color:var(--bg); min-height:48px; margin-top:12px; opacity:.4; }
.small { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><i>P</i>PK Direction Consultation</div>
  <div class="card">
    <span class="pill"><b></b>Opens soon</span>
    <h1>The Future Direction of PuroKalusugan</h1>
    <p>The pre-work module will open in early November. You will receive a link and an access code by email from the Bureau of Local Health Systems Development.</p>
    <label class="small" for="code">Access code</label>
    <input id="code" type="text" placeholder="Not open yet" disabled>
    <button type="button" disabled>Continue</button>
    <p class="small" style="margin-top:18px">Department of Health, Bureau of Local Health Systems Development</p>
  </div>
</div>
</body>
</html>
