<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PK Direction Consultation</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell">
  <header class="nav">
    <div class="brand"><i>P</i><span>PK Direction Consultation</span></div>
    <div class="navr"><button type="button" class="langbtn" id="langBtn" hidden></button><div class="save" id="saveState" hidden></div></div>
  </header>

  <section id="gate" class="card" style="margin-top:28px;max-width:640px;margin-left:auto;margin-right:auto">
    <span class="pill"><b></b>Pre-work module</span>
    <h2>The Future Direction of PuroKalusugan</h2>
    <p>Please enter the access code you received from the Bureau of Local Health Systems Development.</p>
    <label class="t" for="code" style="display:block;font-weight:600;margin-bottom:6px">Access code</label>
    <input id="code" type="text" placeholder="PK-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="nav2" style="justify-content:flex-start;margin-top:14px"><button class="btn" id="codeGo" type="button">Continue</button></div>
    <div id="gateMsg"></div>
    <p class="foot" style="text-align:left;margin-top:22px">Department of Health, Bureau of Local Health Systems Development</p>
  </section>

  <div id="module" class="layout" hidden>
    <nav class="prog" aria-label="Progress"><ol class="segs" id="segs"></ol></nav>
    <div class="pills"><span class="pill" id="crumb"><b></b><span></span></span><span class="pill plain" id="crumb2"></span></div>
    <main id="main" tabindex="-1" aria-live="polite"></main>
  </div>
</div>
<div id="gloss" role="dialog" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
